blueprint:
  name: Shutter schedule with window protection
  description: >-
    Open a selected cover at the configured opening time and when the selected
    window opens. Open it only if it is closed. Close it at sunset or the
    configured closing time, whichever comes first, unless the window is open.
    If the window closes before the opening time or after that evening close
    time, close the cover then.
  domain: automation
  input:
    cover_entity:
      name: Cover
      description: The cover to open and close.
      selector:
        entity:
          filter:
            - domain: cover
    window_entity:
      name: Window opening sensor (optional)
      description: >-
        A binary sensor that is on when the window is open. Opening the window
        opens the cover and prevents it from closing until the window is shut.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
    opening_time:
      name: Opening time
      description: Time of day to open the cover.
      default: "07:00:00"
      selector:
        time: {}
    closing_time:
      name: Closing time
      description: Time of day to close the cover. Sunset can close it earlier.
      default: "20:00:00"
      selector:
        time: {}

variables:
  opening_time: !input opening_time
  closing_time: !input closing_time
  window_entity: !input window_entity

triggers:
  - trigger: time
    at: !input opening_time
    id: open
  - trigger: time
    at: !input closing_time
    id: close
  - trigger: sun
    event: sunset
    id: close
  # When the window sensor changes to on, open the cover.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'on') }}"
    id: window_open
  # When it changes to off, the actions close early or after the evening cutoff.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'off') }}"
    id: window_closed

actions:
  - choose:
      # Open for the schedule or window only if the cover is currently closed.
      - conditions:
          - condition: trigger
            id:
              - open
              - window_open
          - condition: state
            entity_id: !input cover_entity
            state: "closed"
        sequence:
          - action: cover.open_cover
            target:
              entity_id: !input cover_entity
      # If the window closes before the opening time, or after sunset/closing time, close now.
      - conditions:
          - condition: trigger
            id: window_closed
          - condition: template
            value_template: >-
              {{ now().strftime('%H:%M:%S') < opening_time
                 or now().strftime('%H:%M:%S') >= closing_time
                 or is_state('sun.sun', 'below_horizon') }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover_entity
      # At sunset or the configured closing time, close only if no window sensor is set or it is off.
      - conditions:
          - condition: trigger
            id: close
          - condition: template
            value_template: >-
              {{ window_entity == '' or is_state(window_entity, 'off') }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover_entity

mode: single
