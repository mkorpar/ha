blueprint:
  name: Shutter schedule with window protection
  description: >-
    Open a selected cover at 7:00 AM and when the selected window opens.
    Close it at sunset or 8:00 PM, whichever comes first, unless the window
    is open. If the window closes before 7:00 AM or after that evening
    close time, close the cover then.
  domain: automation
  input:
    cover_entity:
      name: Cover
      description: The cover to open and close.
      selector:
        entity:
          filter:
            - domain: cover
    window_entity:
      name: Window opening sensor (optional)
      description: >-
        A binary sensor that is on when the window is open. Opening the window
        opens the cover and prevents it from closing until the window is shut.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor

trigger_variables:
  window_entity: !input window_entity

triggers:
  - trigger: time
    at: "07:00:00"
    id: open
  - trigger: time
    at: "20:00:00"
    id: close
  - trigger: sun
    event: sunset
    id: close
  # When the window sensor changes to on, open the cover.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'on') }}"
    id: window_open
  # When it changes to off, the actions close early or after the evening cutoff.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'off') }}"
    id: window_closed

actions:
  - choose:
      # The 7:00 AM schedule and a newly opened window both open the cover.
      - conditions:
          - condition: trigger
            id:
              - open
              - window_open
        sequence:
          - action: cover.open_cover
            target:
              entity_id: !input cover_entity
      # If the window closes before 7:00 AM, or after sunset/8:00 PM, close now.
      - conditions:
          - condition: trigger
            id: window_closed
          - condition: template
            value_template: >-
              {{ now().strftime('%H:%M:%S') < '07:00:00'
                 or now().strftime('%H:%M:%S') >= '20:00:00'
                 or is_state('sun.sun', 'below_horizon') }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover_entity
      # At sunset or 8:00 PM, close only if no window sensor is set or it is off.
      - conditions:
          - condition: trigger
            id: close
          - condition: template
            value_template: >-
              {{ window_entity == '' or is_state(window_entity, 'off') }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover_entity

mode: single
