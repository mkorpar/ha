blueprint:
  name: Shutter schedule with window protection
  description: >-
    Follow a Schedule helper's pct_open additional data (0 = closed,
    100 = fully open). An inactive schedule, or a missing/invalid pct_open,
    means fully open. Sunset overrides the schedule until sunrise.
    An open window prevents closing or repositioning and opens a closed cover.
    When the window closes, apply the current schedule or sunset override.
    Full-open commands are sent only when the cover is closed.
    Partial positions require a cover that supports setting its position.
    Optional date ranges restrict all actions to dates within any listed range.
    Each range repeats yearly and is inclusive. An empty list allows all dates.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    killswitch:
      name: Automation enabled
      description: Select an input_boolean helper. On enables shutter control; off blocks all shutter actions.
      selector:
        entity:
          filter:
            - domain: input_boolean
    cover_entity:
      name: Cover
      description: The cover to open, close, and position.
      selector:
        entity:
          filter:
            - domain: cover
    schedule_entity:
      name: Shutter schedule
      description: >-
        Select a Schedule helper. Set pct_open from 0 to 100 in each block's
        Additional data. Outside active blocks, the target is fully open.
      selector:
        entity:
          filter:
            - domain: schedule
    window_entity:
      name: Window opening sensor (optional)
      description: >-
        A binary sensor that is on when the window is open. An open window
        opens a closed cover and prevents closing or repositioning until shut.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor

    active_date_ranges:
      name: Active date ranges (optional)
      description: |-
        Enter a YAML list of yearly date ranges using quoted MM-DD values.
        Boundaries are inclusive. The automation runs if any range matches.
        A range with start later than end crosses New Year.
        An empty list ([]) allows all dates. Omit start for January 1 or
        end for December 31. February 29 matches only in leap years.
        Example:
        ```yaml
        - start: "01-01"
          end: "03-31"
        - start: "10-01"
          end: "12-31"
        ```
      default: []
      selector:
        object: {}

trigger_variables:
  window_entity: !input window_entity

variables:
  active_date_ranges: !input active_date_ranges
  cover_entity: !input cover_entity
  schedule_entity: !input schedule_entity
  window_entity: !input window_entity

triggers:
  # Apply the current target immediately when shutter control is enabled.
  - trigger: state
    entity_id: !input killswitch
    to: "on"
    id: enabled
  # Apply the current target when a new local date begins.
  - trigger: time
    at: "00:00:00"
    id: date_changed
  # Include attribute changes so touching blocks with different pct_open work.
  - trigger: state
    entity_id: !input schedule_entity
    id: schedule_changed
  - trigger: sun
    event: sunset
    id: sunset
  # Resume the schedule when the overnight sunset override ends.
  - trigger: sun
    event: sunrise
    id: sunrise
  - trigger: homeassistant
    event: start
    id: startup
  # Opening the window opens the cover only if it is currently closed.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'on') }}"
    id: window_open
  # Closing the window reapplies the current schedule or sunset override.
  - trigger: template
    value_template: "{{ window_entity != '' and is_state(window_entity, 'off') }}"
    id: window_closed

actions:
  # Read the helper's current state when each queued run begins.
  # Off, unknown, or unavailable blocks window, sunset, and schedule actions.
  - condition: state
    entity_id: !input killswitch
    state: "on"
  # Evaluate all ranges when each queued run executes; any matching range allows it.
  - condition: template
    value_template: >-
      {% set today = now().strftime('%m-%d') %}
      {% set ns = namespace(active=false) %}
      {% if active_date_ranges is sequence
            and active_date_ranges is not string
            and active_date_ranges is not mapping %}
        {% if active_date_ranges | length == 0 %}
          {% set ns.active = true %}
        {% endif %}
        {% for period in active_date_ranges if period is mapping %}
          {% set start = period.get('start') or '01-01' %}
          {% set end = period.get('end') or '12-31' %}
          {# Validate against a leap year so February 29 is a valid boundary. #}
          {% set parsed_start = strptime('2000-' ~ (start | string), '%Y-%m-%d', none) %}
          {% set parsed_end = strptime('2000-' ~ (end | string), '%Y-%m-%d', none) %}
          {% if parsed_start is not none and parsed_end is not none %}
            {% set first = parsed_start.strftime('%m-%d') %}
            {% set last = parsed_end.strftime('%m-%d') %}
            {% if (first <= last and first <= today <= last)
                  or (first > last and (today >= first or today <= last)) %}
              {% set ns.active = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.active }}
  - choose:
      # Window protection takes priority while the window is open.
      - conditions: "{{ window_entity != '' and is_state(window_entity, 'on') }}"
        sequence:
          - condition: state
            entity_id: !input cover_entity
            state: "closed"
          - action: cover.open_cover
            target:
              entity_id: !input cover_entity
    default:
      # A configured sensor must report closed before positioning the cover.
      - condition: template
        value_template: "{{ window_entity == '' or is_state(window_entity, 'off') }}"
      # Wait for valid sun/schedule data rather than treating unavailable as off.
      - condition: template
        value_template: >-
          {{ trigger.id == 'sunset'
             or (trigger.id == 'sunrise' and states(schedule_entity) in ['on', 'off'])
             or is_state('sun.sun', 'below_horizon')
             or (is_state('sun.sun', 'above_horizon')
                 and states(schedule_entity) in ['on', 'off']) }}
      - variables:
          target_position: >-
            {% if trigger.id == 'sunset' or
                  (trigger.id != 'sunrise' and is_state('sun.sun', 'below_horizon')) %}
              0
            {% elif is_state(schedule_entity, 'on') %}
              {% set pct = state_attr(schedule_entity, 'pct_open') | float(100) %}
              {{ ([0, ([pct, 100] | min)] | max) | round(0) | int }}
            {% else %}
              100
            {% endif %}
      - choose:
          - conditions: "{{ target_position | int == 0 }}"
            sequence:
              - action: cover.close_cover
                target:
                  entity_id: !input cover_entity
          # Preserve the existing closed-only check for full opening.
          - conditions: "{{ target_position | int == 100 }}"
            sequence:
              - condition: state
                entity_id: !input cover_entity
                state: "closed"
              - action: cover.open_cover
                target:
                  entity_id: !input cover_entity
        default:
          # Intermediate schedule values set the requested partial position.
          - action: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: "{{ target_position | int }}"

mode: queued
max: 10
