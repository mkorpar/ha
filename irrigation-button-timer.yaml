blueprint:
  name: Irrigation - button with timed run
  description: >-
    Start irrigation when an input button helper is pressed. The irrigation
    switch turns off after the configured duration, or the run ends early if
    the switch is turned off manually. Additional presses while running are
    ignored.
  domain: automation
  input:
    start_button:
      name: Start button
      description: Input button helper that starts irrigation when pressed.
      selector:
        entity:
          domain: input_button
    irrigation_switch:
      name: Irrigation switch
      selector:
        entity:
          domain: switch
    run_duration:
      name: Run duration
      description: Maximum time to leave irrigation on.
      default:
        minutes: 10
      selector:
        duration:

mode: single

trigger:
  - platform: state
    entity_id: !input start_button

variables:
  irrigation_switch: !input irrigation_switch

action:
  - service: switch.turn_on
    target:
      entity_id: !input irrigation_switch
  - wait_template: "{{ is_state(irrigation_switch, 'off') }}"
    timeout: !input run_duration
    continue_on_timeout: true
  - service: switch.turn_off
    target:
      entity_id: !input irrigation_switch
