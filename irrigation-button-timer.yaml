alias: Irrigation - timed run
description: >-
  Run the selected irrigation switch for the chosen duration, or stop early if
  the switch is turned off manually.
mode: single
max_exceeded: silent

fields:
  irrigation_switch:
    name: Irrigation switch
    description: Switch that controls irrigation.
    required: true
    selector:
      entity:
        domain: switch
  run_duration:
    name: Run duration
    description: Maximum time to leave irrigation on.
    required: true
    default:
      minutes: 10
    selector:
      duration: {}

sequence:
  - action: switch.turn_on
    target:
      entity_id: "{{ irrigation_switch }}"
  - wait_template: "{{ is_state(irrigation_switch, 'on') }}"
    timeout: "00:00:10"
    continue_on_timeout: false
  - wait_template: "{{ is_state(irrigation_switch, 'off') }}"
    timeout: "{{ run_duration }}"
    continue_on_timeout: true
  - action: switch.turn_off
    target:
      entity_id: "{{ irrigation_switch }}"
