blueprint:
  name: ClimateSchedule
  source_url: https://github.com/mkorpar/ha/blob/main/climate-schedule.yaml
  domain: automation
  input:
    climate_input:
      name: Climate
      selector:
        entity:
          multiple: false
          domain: climate
    schedule:
      name: Schedule
      selector:
        entity:
          multiple: false
          domain: schedule
    heat_switch:
      name: Heat switch
      selector:
        entity:
          multiple: false
          domain: input_boolean
    always_on:
      name: Keep climate always on
      default: false
      selector:
        boolean: {}
    before_temperature_actions:
      name: Actions before setting temperature
      default: []
      selector:
        action: {}
    window_sensor:
      name: Window contact sensors
      description: Optional sensors that report whether windows are open.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class: opening

triggers:
  - trigger: state
    entity_id: !input schedule
  - trigger: state
    entity_id: !input heat_switch
    id: heat_switch
  - trigger: state
    entity_id: !input climate_input
    from: unavailable
  - trigger: state
    entity_id: !input climate_input
    from: unknown
  - trigger: template
    value_template: "{{ expand(window_sensor | default([], true)) | selectattr('state', 'eq', 'on') | list | length > 0 }}"
    for:
      minutes: 5
    id: window_open
  - trigger: template
    value_template: "{{ window_sensor | default([], true) | length > 0 and expand(window_sensor) | selectattr('state', 'eq', 'off') | list | length == window_sensor | length }}"
    for:
      minutes: 1
    id: window_closed

trigger_variables:
  _climate_input: !input climate_input
  window_sensor: !input window_sensor

conditions: []

actions:
  - variables:
      schedule: !input schedule
      climate_input: !input climate_input
      heat_switch: !input heat_switch
      always_on_input: !input always_on
      before_temperature_actions: !input before_temperature_actions
      window_sensor: !input window_sensor

  - variables:
      always_on: "{{ always_on_input or 'off' not in (state_attr(climate_input, 'hvac_modes') or []) }}"

  - if:
      - condition: state
        entity_id: !input heat_switch
        state: "on"
    then:
      - if:
          - condition: state
            entity_id: !input schedule
            state: "on"
          - condition: template
            value_template: "{{ expand(window_sensor | default([], true)) | selectattr('state', 'eq', 'on') | list | length == 0 }}"
        then:
          - if:
              - condition: template
                value_template: "{{ not always_on }}"
              - condition: state
                entity_id: !input climate_input
                state: "off"
            then:
              - action: climate.turn_on
                target:
                  entity_id: !input climate_input
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ before_temperature_actions | length > 0 }}"
                sequence: !input before_temperature_actions
          - action: climate.set_temperature
            metadata: {}
            data:
              temperature: "{{ state_attr(schedule, 'temperature') }}"
            target:
              entity_id: !input climate_input
        else:
          - if:
              - condition: template
                value_template: "{{ not always_on }}"
            then:
              - action: climate.turn_off
                target:
                  entity_id: !input climate_input
    else:
      - if:
          - condition: trigger
            id: heat_switch
          - condition: template
            value_template: "{{ not always_on }}"
        then:
          - action: climate.turn_off
            target:
              entity_id: !input climate_input

mode: single
