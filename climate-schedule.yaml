blueprint:
  name: ClimateSchedule
  source_url: https://github.com/mkorpar/ha/blob/main/climate-schedule.yaml
  domain: automation
  input:
    climate_input:
      name: Climate
      selector:
        entity:
          multiple: false
          domain: climate
    schedule:
      name: Schedule
      selector:
        entity:
          multiple: false
          domain: schedule
    default_temp:
      name: Default temperature
      description: Used when "Turn off instead of default temperature" is disabled.
      default: 18
      selector:
        number:
          min: 5
          max: 25
          unit_of_measurement: "°C"
    heat_switch:
      name: Heat switch
      selector:
        entity:
          multiple: false
          domain: input_boolean
    turn_off_instead:
      name: Turn off instead of default temperature
      default: false
      selector:
        boolean: {}
    always_on:
      name: Keep climate always on
      default: false
      selector:
        boolean: {}
    before_temperature_actions:
      name: Actions before setting temperature
      default: []
      selector:
        action: {}

triggers:
  - trigger: state
    entity_id: !input schedule
  - trigger: state
    entity_id: !input heat_switch
    id: heat_switch

trigger_variables:
  _climate_input: !input climate_input

conditions: []

actions:
  - variables:
      schedule: !input schedule
      climate_input: !input climate_input
      default_temp: !input default_temp
      turn_off_instead: !input turn_off_instead
      heat_switch: !input heat_switch
      always_on: !input always_on

  - if:
      - condition: state
        entity_id: !input heat_switch
        state: "on"
    then:
      - if:
          - condition: state
            entity_id: !input schedule
            state: "on"
        then:
          - if:
              - condition: template
                value_template: "{{ not always_on }}"
              - condition: state
                entity_id: !input climate_input
                state: "off"
            then:
              - action: climate.turn_on
                target:
                  entity_id: !input climate_input
          - !input before_temperature_actions
          - action: climate.set_temperature
            metadata: {}
            data:
              temperature: "{{ state_attr(schedule, 'temperature') }}"
            target:
              entity_id: !input climate_input
        else:
          - if:
              - condition: template
                value_template: "{{ is_state(turn_off_instead, 'on') }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not always_on }}"
                then:
                  - action: climate.turn_off
                    target:
                      entity_id: !input climate_input
            else:
              - if:
                  - condition: template
                    value_template: "{{ not always_on }}"
                  - condition: state
                    entity_id: !input climate_input
                    state: "off"
                then:
                  - action: climate.turn_on
                    target:
                      entity_id: !input climate_input
              - !input before_temperature_actions
              - action: climate.set_temperature
                metadata: {}
                data:
                  temperature: !input default_temp
                target:
                  entity_id: !input climate_input
    else:
      - if:
          - condition: trigger
            id: heat_switch
          - condition: template
            value_template: "{{ not always_on }}"
        then:
          - action: climate.turn_off
            target:
              entity_id: !input climate_input

mode: single
